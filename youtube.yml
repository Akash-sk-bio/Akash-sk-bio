name: Latest YouTube Videos

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCXX_REPLACE_WITH_YOUR_CHANNEL_ID"
          max_post_count: 5
          readme_path: README.md
          comment_tag_name: YOUTUBE-VIDEOS
          template: "* [$title]($url) — $date\n"
          date_format: "MMM DD, YYYY"
