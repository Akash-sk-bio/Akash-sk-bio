<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#161B22"/>
      <stop offset="100%" stop-color="#11151C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C9A227" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="430" fill="url(#bg)"/>
  <line x1="0" y1="0" x2="900" y2="0" stroke="#30363D" stroke-width="1"/>

  <!-- Premium eyebrow -->
  <text x="450" y="44" text-anchor="middle" fill="#58A6FF"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="400" letter-spacing="6">EXPERTISE</text>

  <!-- Heading -->
  <text x="450" y="80" text-anchor="middle" fill="#E6EDF3"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="300" letter-spacing="3">What&#160;&#160;I&#160;&#160;Build</text>

  <!-- Gold hairline under heading -->
  <rect x="390" y="94" width="120" height="1.5" fill="url(#goldLine)"/>

  <!-- Subtitle -->
  <text x="450" y="120" text-anchor="middle" fill="#8B949E"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="300" letter-spacing="0.5">
    Engineering at the intersection of biology, intelligence, and craft
  </text>

  <!-- Faint column dividers -->
  <line x1="255" y1="150" x2="255" y2="400" stroke="#30363D" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="463" y1="150" x2="463" y2="400" stroke="#30363D" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="671" y1="150" x2="671" y2="400" stroke="#30363D" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- ════════ CARD 1 — AI × Biotechnology ════════ -->
  <rect x="46" y="160" width="200" height="240" rx="8" fill="url(#cardBg)" stroke="#30363D" stroke-width="1"/>
  <rect x="68" y="182" width="42" height="42" rx="10" fill="#0D1117" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.35"/>
  <!-- molecule line icon -->
  <g stroke="#58A6FF" stroke-width="1.4" fill="none">
    <line x1="89" y1="203" x2="78" y2="194"/>
    <line x1="89" y1="203" x2="100" y2="194"/>
    <line x1="89" y1="203" x2="89" y2="216"/>
    <circle cx="89" cy="203" r="3" fill="#58A6FF"/>
    <circle cx="78" cy="194" r="2.4" fill="#0D1117"/>
    <circle cx="100" cy="194" r="2.4" fill="#0D1117"/>
    <circle cx="89" cy="216" r="2.4" fill="#0D1117"/>
  </g>
  <text x="68" y="252" fill="#E6EDF3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">AI &#215; Biotechnology</text>
  <text x="68" y="276" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">Machine-learning models on</text>
  <text x="68" y="292" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">biological data and computer</text>
  <text x="68" y="308" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">vision for the life sciences.</text>
  <rect x="68" y="370" width="44" height="2" rx="1" fill="url(#accentBar)"/>

  <!-- ════════ CARD 2 — Machine Learning ════════ -->
  <rect x="258" y="160" width="200" height="240" rx="8" fill="url(#cardBg)" stroke="#30363D" stroke-width="1"/>
  <rect x="280" y="182" width="42" height="42" rx="10" fill="#0D1117" stroke="#A371F7" stroke-width="1" stroke-opacity="0.35"/>
  <!-- neural net line icon -->
  <g stroke="#A371F7" stroke-width="1.3" fill="none">
    <line x1="290" y1="195" x2="304" y2="195"/>
    <line x1="290" y1="195" x2="304" y2="211"/>
    <line x1="290" y1="211" x2="304" y2="195"/>
    <line x1="290" y1="211" x2="304" y2="211"/>
    <circle cx="290" cy="195" r="2.6" fill="#A371F7"/>
    <circle cx="290" cy="211" r="2.6" fill="#A371F7"/>
    <circle cx="304" cy="195" r="2.6" fill="#0D1117"/>
    <circle cx="304" cy="211" r="2.6" fill="#0D1117"/>
  </g>
  <text x="280" y="252" fill="#E6EDF3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Machine Learning</text>
  <text x="280" y="276" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">End-to-end pipelines, LLM</text>
  <text x="280" y="292" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">fine-tuning, RAG, agentic</text>
  <text x="280" y="308" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">and multi-agent systems.</text>
  <rect x="280" y="370" width="44" height="2" rx="1" fill="url(#accentBar)"/>

  <!-- ════════ CARD 3 — Content Creation ════════ -->
  <rect x="466" y="160" width="200" height="240" rx="8" fill="url(#cardBg)" stroke="#30363D" stroke-width="1"/>
  <rect x="488" y="182" width="42" height="42" rx="10" fill="#0D1117" stroke="#58A6FF" stroke-width="1" stroke-opacity="0.35"/>
  <!-- play line icon -->
  <g stroke="#58A6FF" stroke-width="1.4" fill="none" stroke-linejoin="round">
    <path d="M504 195 L516 203 L504 211 Z" fill="#58A6FF" fill-opacity="0.15"/>
  </g>
  <text x="488" y="252" fill="#E6EDF3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Content Creation</text>
  <text x="488" y="276" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">YouTube tutorials and short</text>
  <text x="488" y="292" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">form content that makes AI</text>
  <text x="488" y="308" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">and biotech accessible.</text>
  <rect x="488" y="370" width="44" height="2" rx="1" fill="url(#accentBar)"/>

  <!-- ════════ CARD 4 — Open Source ════════ -->
  <rect x="674" y="160" width="200" height="240" rx="8" fill="url(#cardBg)" stroke="#30363D" stroke-width="1"/>
  <rect x="696" y="182" width="42" height="42" rx="10" fill="#0D1117" stroke="#A371F7" stroke-width="1" stroke-opacity="0.35"/>
  <!-- git branch line icon -->
  <g stroke="#A371F7" stroke-width="1.4" fill="none">
    <line x1="711" y1="193" x2="711" y2="213"/>
    <path d="M711 199 q0 6 7 6"/>
    <circle cx="711" cy="193" r="2.6" fill="#A371F7"/>
    <circle cx="711" cy="213" r="2.6" fill="#0D1117"/>
    <circle cx="720" cy="205" r="2.6" fill="#0D1117"/>
  </g>
  <text x="696" y="252" fill="#E6EDF3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Open Source</text>
  <text x="696" y="276" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">Python utilities, reusable</text>
  <text x="696" y="292" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">tools and scientific AI</text>
  <text x="696" y="308" fill="#8B949E" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="300">shared with the community.</text>
  <rect x="696" y="370" width="44" height="2" rx="1" fill="url(#accentBar)"/>

  <line x1="0" y1="429" x2="900" y2="429" stroke="#30363D" stroke-width="1"/>
</svg>
